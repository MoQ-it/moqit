<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="852" viewBox="0 0 1290 852" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>moqit architecture</title>
  <style>
    .bg { fill: #ffffff; }
    .txt { fill: #1f2937; }
    .muted { fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .b { font-weight: 600; }
    .ns { fill: #3b6fd8; }
    .client { fill: #eef4ff; stroke: #3b6fd8; stroke-width: 1.5; }
    .server { fill: #ecf8f0; stroke: #2f9e58; stroke-width: 1.5; }
    .edge { fill: #e8f6f8; stroke: #1f9aa8; stroke-width: 1.5; }
    .redis { fill: #fdf0ef; stroke: #d2453b; stroke-width: 1.5; }
    .backend { fill: #fff6e5; stroke: #c98a12; stroke-width: 1.5; }
    .inner { fill: #ffffff; stroke: #c7cdd6; stroke-width: 1; }
    .note { fill: #f6f8fa; stroke: #c7cdd6; stroke-width: 1; }
    .moq { stroke: #3b6fd8; stroke-width: 2.2; fill: none; }
    .ctl { stroke: #d2453b; stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; }
    .http { stroke: #c98a12; stroke-width: 2; stroke-dasharray: 1 5; stroke-linecap: round; fill: none; }
    .local { stroke: #6b7280; stroke-width: 1.6; fill: none; }
    .mk-moq { fill: #3b6fd8; }
    .mk-ctl { fill: #d2453b; }
    .mk-http { fill: #c98a12; }
    .mk-local { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .txt { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .ns { fill: #79a6ff; }
      .client { fill: #142340; stroke: #5b8ef0; }
      .server { fill: #11291b; stroke: #3fb96d; }
      .edge { fill: #0f2a2e; stroke: #35b3c2; }
      .redis { fill: #331716; stroke: #f0645a; }
      .backend { fill: #2e2310; stroke: #e0a530; }
      .inner { fill: #161b22; stroke: #3d444d; }
      .note { fill: #161b22; stroke: #3d444d; }
      .moq { stroke: #5b8ef0; }
      .ctl { stroke: #f0645a; }
      .http { stroke: #e0a530; }
      .local { stroke: #9198a1; }
      .mk-moq { fill: #5b8ef0; }
      .mk-ctl { fill: #f0645a; }
      .mk-http { fill: #e0a530; }
      .mk-local { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a-moq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-moq" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ctl" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-http" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-local" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1290" height="852"/>

  <text class="txt b" x="30" y="44" font-size="24">moqit architecture</text>
  <text class="muted" x="30" y="68" font-size="13">Browsers, nodes and edges talk MoQ Transport (draft-22) over QUIC; everything, signalling included, is a MoQ track.</text>

  <!-- Your backend -->
  <rect class="backend" x="420" y="90" width="420" height="90" rx="10"/>
  <text class="txt b" x="436" y="114" font-size="15">Your backend</text>
  <text class="muted mono" x="824" y="114" font-size="11" text-anchor="end">e.g. cmd/meet</text>
  <text class="txt" x="436" y="140" font-size="12">mints JWT access tokens (pkg/auth, sdk/go, moqit token)</text>
  <text class="txt" x="436" y="160" font-size="12">manages rooms with RoomService · receives signed webhooks</text>

  <!-- Browser participant -->
  <rect class="client" x="30" y="236" width="280" height="252" rx="10"/>
  <text class="txt b" x="46" y="258" font-size="15">Browser participant</text>
  <rect class="inner" x="46" y="268" width="248" height="38" rx="6"/>
  <text class="txt b" x="170" y="284" font-size="12" text-anchor="middle">Meet app</text>
  <text class="muted mono" x="170" y="299" font-size="10.5" text-anchor="middle">web/apps/meet</text>
  <rect class="inner" x="46" y="312" width="248" height="38" rx="6"/>
  <text class="txt b" x="170" y="328" font-size="12" text-anchor="middle">@moqit/react</text>
  <text class="muted" x="170" y="343" font-size="10.5" text-anchor="middle">components · hooks</text>
  <rect class="inner" x="46" y="356" width="248" height="74" rx="6"/>
  <text class="txt b" x="170" y="372" font-size="12" text-anchor="middle">@moqit/client</text>
  <text class="muted" x="170" y="388" font-size="10.5" text-anchor="middle">Room · WebCodecs · simulcast</text>
  <text class="muted" x="170" y="403" font-size="10.5" text-anchor="middle">send control · adaptive stream</text>
  <text class="muted" x="170" y="418" font-size="10.5" text-anchor="middle">jitter buffer · lip sync · rewind</text>
  <rect class="inner" x="46" y="436" width="248" height="38" rx="6"/>
  <text class="txt b" x="170" y="452" font-size="12" text-anchor="middle">@moq-it/moqt</text>
  <text class="muted" x="170" y="467" font-size="10.5" text-anchor="middle">MoQ draft-22 over WebTransport</text>

  <!-- Go client / ingress -->
  <rect class="client" x="30" y="504" width="280" height="60" rx="10"/>
  <text class="txt b" x="46" y="528" font-size="13">Go client · RTMP ingress</text>
  <text class="muted mono" x="46" y="548" font-size="10.5">sdk/go/client · moqit-ingress</text>

  <!-- Node A -->
  <rect class="server" x="420" y="236" width="420" height="332" rx="10"/>
  <text class="txt b" x="436" y="258" font-size="15">moqit-server node</text>
  <text class="muted mono" x="574" y="258" font-size="11">cmd/moqit-server</text>
  <rect class="inner" x="436" y="272" width="190" height="42" rx="6"/>
  <text class="txt b" x="531" y="289" font-size="12" text-anchor="middle">UDP :4443</text>
  <text class="muted" x="531" y="304" font-size="10.5" text-anchor="middle">WebTransport /moq · raw QUIC</text>
  <rect class="inner" x="634" y="272" width="190" height="42" rx="6"/>
  <text class="txt b" x="729" y="289" font-size="12" text-anchor="middle">HTTP :7880</text>
  <text class="muted" x="729" y="304" font-size="10.5" text-anchor="middle">RoomService (Connect) · /v1/route</text>
  <path class="local" d="M531,314 V329"/>
  <rect class="inner" x="436" y="330" width="388" height="62" rx="6"/>
  <text class="txt b" x="452" y="348" font-size="12">moqt relay</text>
  <text class="muted" x="452" y="364" font-size="10.5">one upstream subscription per track, fanned out to every subscriber</text>
  <text class="muted" x="452" y="379" font-size="10.5">authorizer hook · FETCH served from the recording archive</text>
  <path class="moq" d="M610,394 V412" marker-start="url(#a-moq)" marker-end="url(#a-moq)" stroke-width="1.6"/>
  <text class="muted" x="620" y="407" font-size="10" font-style="italic">loopback MoQ session</text>
  <rect class="inner" x="436" y="414" width="388" height="76" rx="6"/>
  <text class="txt b" x="452" y="432" font-size="12">pkg/room <tspan class="muted" font-weight="400">rooms and participants</tspan></text>
  <text class="muted" x="452" y="448" font-size="10.5">publishes room state and inboxes · reads signal tracks</text>
  <text class="muted" x="452" y="463" font-size="10.5">authorizes every request · active speakers</text>
  <text class="muted" x="452" y="478" font-size="10.5">uplink delay → SendFeedback · DVR recording</text>
  <rect class="inner" x="436" y="506" width="91" height="46" rx="6"/>
  <text class="txt b mono" x="481.5" y="525" font-size="10.5" text-anchor="middle">pkg/auth</text>
  <text class="muted" x="481.5" y="541" font-size="10" text-anchor="middle">JWT grants</text>
  <rect class="inner" x="535" y="506" width="91" height="46" rx="6"/>
  <text class="txt b mono" x="580.5" y="525" font-size="10.5" text-anchor="middle">pkg/dvr</text>
  <text class="muted" x="580.5" y="541" font-size="10" text-anchor="middle">recordings</text>
  <rect class="inner" x="634" y="506" width="91" height="46" rx="6"/>
  <text class="txt b mono" x="679.5" y="525" font-size="10.5" text-anchor="middle">pkg/webhook</text>
  <text class="muted" x="679.5" y="541" font-size="10" text-anchor="middle">signed events</text>
  <rect class="inner" x="733" y="506" width="91" height="46" rx="6"/>
  <text class="txt b mono" x="778.5" y="525" font-size="10.5" text-anchor="middle">pkg/cluster</text>
  <text class="muted" x="778.5" y="541" font-size="10" text-anchor="middle">Redis client</text>

  <!-- Recording disk -->
  <path class="local" d="M580.5,552 V588" marker-end="url(#a-local)"/>
  <path class="note" d="M528,598 a52.5,9 0 0 0 105,0 v40 a52.5,9 0 0 1 -105,0 z"/>
  <ellipse class="note" cx="580.5" cy="598" rx="52.5" ry="9"/>
  <text class="txt" x="580.5" y="626" font-size="11" text-anchor="middle">disk</text>
  <text class="muted mono" x="580.5" y="641" font-size="10" text-anchor="middle">-dvr-dir</text>

  <!-- Node B -->
  <rect class="server" x="920" y="236" width="330" height="72" rx="10"/>
  <text class="txt b" x="936" y="260" font-size="14">moqit-server node B</text>
  <text class="muted" x="936" y="280" font-size="11">the same room's other participants</text>
  <text class="muted" x="936" y="296" font-size="11">each node relays the tracks its participants publish</text>

  <!-- Edges -->
  <rect class="edge" x="920" y="356" width="330" height="72" rx="10"/>
  <text class="txt b" x="936" y="380" font-size="14">Edge, tier 1</text>
  <text class="muted mono" x="1234" y="380" font-size="10.5" text-anchor="end">-edge -tier 1</text>
  <text class="muted" x="936" y="400" font-size="11">viewers only · fetches each track once</text>
  <text class="muted" x="936" y="416" font-size="11">from the node hosting its publisher</text>
  <rect class="edge" x="920" y="476" width="330" height="72" rx="10"/>
  <text class="txt b" x="936" y="500" font-size="14">Edge, tier 2</text>
  <text class="muted mono" x="1234" y="500" font-size="10.5" text-anchor="end">-edge -tier 2</text>
  <text class="muted" x="936" y="520" font-size="11">fetches through a tier 1 edge in its region</text>
  <text class="muted" x="936" y="536" font-size="11">one parent per room (rendezvous hashing)</text>

  <!-- Viewers -->
  <rect class="client" x="920" y="596" width="330" height="64" rx="10"/>
  <text class="txt b" x="936" y="620" font-size="14">Viewers <tspan class="muted" font-weight="400" font-size="12">Meet watch page, moqit bench</tspan></text>
  <text class="muted" x="936" y="642" font-size="11">read-only · watch live, or FETCH history to rewind</text>

  <!-- Redis -->
  <rect class="redis" x="420" y="700" width="830" height="96" rx="10"/>
  <text class="txt b" x="436" y="724" font-size="15">Redis <tspan class="muted" font-weight="400" font-size="13">cluster state, only when clustered</tspan></text>
  <text class="txt" x="436" y="748" font-size="12">node registry with heartbeats (TTL)</text>
  <text class="txt" x="436" y="766" font-size="12">participants and an event stream per room</text>
  <text class="txt" x="436" y="784" font-size="12">routing: the room's node, edge capacity</text>
  <text class="txt" x="780" y="748" font-size="12">direct messages over pub/sub</text>
  <text class="txt" x="780" y="766" font-size="12">viewer counts</text>
  <text class="txt" x="780" y="784" font-size="12">DVR roster and epoch counter</text>

  <!-- Namespace layout -->
  <rect class="note" x="30" y="596" width="360" height="200" rx="10"/>
  <text class="txt b" x="46" y="618" font-size="13">MoQ namespaces and tracks</text>
  <g class="mono" font-size="11">
    <text class="ns b" x="46" y="642">moqit/&lt;room&gt;/p/&lt;identity&gt;</text>
    <text class="txt" x="58" y="659">mic · camera-h|m|l · screen-h|l</text>
    <text class="txt" x="58" y="675">screen-audio · data · data-lossy · catalog</text>
    <text class="txt" x="58" y="691">signal <tspan class="muted">(server only)</tspan> · dvr <tspan class="muted">(FETCH only)</tspan></text>
    <text class="ns b" x="46" y="715">moqit/&lt;room&gt;/srv</text>
    <text class="txt" x="58" y="732">room <tspan class="muted">RoomStateUpdate</tspan></text>
    <text class="ns b" x="46" y="756">moqit/&lt;room&gt;/srv/to/&lt;identity&gt;</text>
    <text class="txt" x="58" y="773">inbox <tspan class="muted">InboxMessage, SendFeedback</tspan></text>
  </g>

  <!-- HTTP: token, API, webhooks -->
  <path class="http" d="M170,236 V135 H418" marker-end="url(#a-http)"/>
  <text class="txt" x="294" y="127" font-size="11" text-anchor="middle">1. get a token</text>
  <path class="http" d="M760,182 V270" marker-end="url(#a-http)"/>
  <text class="txt" x="768" y="214" font-size="11">API calls</text>
  <path class="http" d="M690,236 V182" marker-end="url(#a-http)"/>
  <text class="txt" x="682" y="214" font-size="11" text-anchor="end">webhooks</text>

  <!-- MoQ: clients to node -->
  <path class="moq" d="M312,293 H434" marker-start="url(#a-moq)" marker-end="url(#a-moq)"/>
  <text class="txt" x="365" y="284" font-size="11" text-anchor="middle">2. WebTransport</text>
  <text class="muted" x="365" y="309" font-size="10.5" text-anchor="middle">publish · subscribe</text>
  <path class="moq" d="M312,534 H418" marker-start="url(#a-moq)" marker-end="url(#a-moq)"/>
  <text class="muted" x="365" y="526" font-size="10.5" text-anchor="middle">MoQ over QUIC</text>

  <!-- MoQ: node to node, edges, viewers -->
  <path class="moq" d="M842,272 H918" marker-start="url(#a-moq)" marker-end="url(#a-moq)"/>
  <text class="muted" x="880" y="264" font-size="10" text-anchor="middle">relay ⇄ relay</text>
  <text class="muted" x="880" y="286" font-size="10" text-anchor="middle">raw QUIC</text>
  <path class="moq" d="M842,392 H918" marker-end="url(#a-moq)"/>
  <text class="muted" x="880" y="384" font-size="10" text-anchor="middle">tracks</text>
  <path class="moq" d="M1085,310 V354" marker-end="url(#a-moq)"/>
  <text class="muted" x="1093" y="336" font-size="10">or from node B</text>
  <path class="moq" d="M1085,430 V474" marker-end="url(#a-moq)"/>
  <text class="muted" x="1093" y="456" font-size="10">one stream per track per region</text>
  <path class="moq" d="M1085,550 V594" marker-end="url(#a-moq)"/>
  <text class="muted" x="1093" y="576" font-size="10">subscribe · FETCH</text>

  <!-- Redis links -->
  <path class="ctl" d="M778.5,552 V698" marker-end="url(#a-ctl)"/>
  <path class="ctl" d="M1250,272 H1268 V748 H1252" marker-end="url(#a-ctl)"/>
  <path class="ctl" d="M1250,392 H1268"/>
  <path class="ctl" d="M1250,512 H1268"/>

  <!-- Legend -->
  <g font-size="11.5">
    <path class="moq" d="M30,828 H66" marker-end="url(#a-moq)"/>
    <text class="txt" x="74" y="832">MoQ over QUIC: media, signalling, relaying</text>
    <path class="ctl" d="M380,828 H416" marker-end="url(#a-ctl)"/>
    <text class="txt" x="424" y="832">cluster state</text>
    <path class="http" d="M530,828 H566" marker-end="url(#a-http)"/>
    <text class="txt" x="574" y="832">HTTP: tokens, API, webhooks</text>
    <path class="local" d="M770,828 H806" marker-end="url(#a-local)"/>
    <text class="txt" x="814" y="832">in-process / local</text>
  </g>
</svg>
